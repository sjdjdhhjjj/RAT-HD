name: Build EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pillow pynput pyaudio pywin32 opencv-python requests pyinstaller
      
      - name: Build with PyInstaller
        run: pyinstaller --onefile --name ChimeraSuper xXHDXx.py
      
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChimeraSuper
          path: dist/ChimeraSuper.exe
